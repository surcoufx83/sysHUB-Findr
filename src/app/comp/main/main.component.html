@if (missingConfig) {
<app-config-invalid>
    {{ l10nphrase.home.disabledFindr.missingConfigFile }}
</app-config-invalid>
}
@else if (authType == undefined || authType == 'apikey') {
<app-config-invalid>
    {{ l10nphrase.home.disabledFindr.apikeyNotSupported }}
</app-config-invalid>
}
@else if (missingScope) {
<app-config-invalid>
    {{ l10nphrase.home.disabledFindr.missingScope }}
</app-config-invalid>
}
@else {
<app-navbar></app-navbar>
<app-progressbar></app-progressbar>
<div class="position-absolute w-100">
    <app-node-inspector [searchResult]="searchResult"></app-node-inspector>
</div>
<div class="container-fluid pt-3 pb-5">
    <router-outlet></router-outlet>
</div>
}
